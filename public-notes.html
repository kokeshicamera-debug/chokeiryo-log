<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>みんなの公開テストノート | 超軽量ログ</title>
  <style>
    :root{--bg:#f4f1e8;--ink:#202018;--sub:#655f51;--line:#d4cdbd;--card:#fffdf7;--accent:#cd853f;--accent-dark:#87531d}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.8}
    .wrap{width:min(860px,calc(100% - 32px));margin:0 auto} header{background:#171717;color:#fff;padding:52px 0 38px}.eyebrow{margin:0;color:#f0d24c;font-size:.9rem;font-weight:800;letter-spacing:.07em}h1{margin:8px 0 0;font-size:clamp(2rem,8vw,3.5rem);line-height:1.2}main{padding:38px 0 64px}h2{font-size:1.3rem;margin:0 0 8px}.lead{margin:0;color:#e9e6dd}.notice,.note{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:20px 0}.notice{border-left:6px solid var(--accent);background:#fff8e4}.note-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.name{font-weight:800;font-size:1.05rem}.meta{font-size:.85rem;color:var(--sub)}.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:#eee5cc;color:#6b4915;font-size:.8rem;font-weight:800;margin-right:5px}.empty{padding:36px 22px;text-align:center;color:var(--sub);border:2px dashed #cfc3a5;border-radius:16px;background:#fffaf0}.button{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:11px;text-decoration:none;font-weight:800;background:#f0d24c;color:#261d00}footer{padding:26px 0 42px;color:var(--sub);font-size:.9rem;border-top:1px solid var(--line)}@media(max-width:600px){.wrap{width:min(100% - 24px,860px)}header{padding-top:44px}}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">超軽量ログ・公開テスト版</p>
      <h1>みんなの公開テストノート</h1>
      <p class="lead">使ってみた人の声を、これからの改善につなげる場所です。</p>
    </div>
  </header>
  <main class="wrap">
    <section class="notice">
      <h2>投稿は作者が確認してから掲載します</h2>
      <p>個人情報や正確な位置情報を含む内容は掲載しません。表示名・端末・おおまかな利用状況・感想を、匿名の公開テストノートとして共有します。</p>
      <a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSctTsuHUbMQHY8PMLEB9d9rkUy6-wvd5Cg8yn1lv6ZyDdqT2g/viewform?usp=header" target="_blank" rel="noopener">テスト報告を送る</a>
    </section>

    <section>
      <h2>届いたテスト報告</h2>
      <div class="empty">
        最初の公開テスト報告をお待ちしています。<br>
        アプリをほめる一言だけでも、大歓迎です！
      </div>
    </section>
  </main>
  <footer><div class="wrap"><a href="./guide.html">超軽量ログの紹介ページへ戻る</a></div></footer>
</body>
</html>
