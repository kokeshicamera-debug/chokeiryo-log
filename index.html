/* ==========================================================
   超軽量ログ Ver.1.02
========================================================== */

const body = document.body;

const themeButton = document.getElementById("themeButton");

const jst = document.getElementById("jst");

const utc = document.getElementById("utc");

const memoButton=document.getElementById("memoButton");

const programPanel = document.getElementById("programPanel");
const potaStatus = document.getElementById("potaStatus");
const sotaStatus = document.getElementById("sotaStatus");
const saveToast=document.getElementById("saveToast");
const largeInfoOverlay=document.getElementById("largeInfoOverlay");

function showToast(message,duration=1800){
    const defaultMessage=saveToast.dataset.defaultMessage || saveToast.textContent;
    saveToast.dataset.defaultMessage=defaultMessage;
    saveToast.textContent=message;
    saveToast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer=setTimeout(()=>{
        saveToast.classList.remove("show");
        saveToast.textContent=defaultMessage;
    },duration);
}

function applyPenStyle(){

    ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--pen").trim();

}



/* ==========================================================
   ダークモード
========================================================== */

if(localStorage.getItem("theme")==="dark"){

    body.classList.add("dark");

    themeButton.textContent="☀";

}else{

    themeButton.textContent="🌙";

}



themeButton.onclick=()=>{

    body.classList.toggle("dark");



    if(body.classList.contains("dark")){

        localStorage.setItem("theme","dark");

        themeButton.textContent="☀";

    }else{

        localStorage.setItem("theme","light");

        themeButton.textContent="🌙";

    }

    applyPenStyle();
    redrawAll();

};



/* ==========================================================
   JST / UTC
========================================================== */

function updateClock(){

    const now=new Date();



    jst.textContent=

    "JST "+now.toLocaleTimeString(

        "ja-JP",

        {

            timeZone:"Asia/Tokyo"

        }

updateClock();

setInterval(updateClock,1000);


/* ==========================================================
   GPS / 住所 / JCC・JCG
========================================================== */

const callAreaByPrefecture={
    "北海道":"8", "青森県":"7", "岩手県":"7", "宮城県":"7", "秋田県":"7", "山形県":"7", "福島県":"7",
    "茨城県":"1", "栃木県":"1", "群馬県":"1", "埼玉県":"1", "千葉県":"1", "東京都":"1", "神奈川県":"1", "山梨県":"1",
    "新潟県":"0", "長野県":"0", "富山県":"9", "石川県":"9", "福井県":"9",
    "岐阜県":"2", "静岡県":"2", "愛知県":"2", "三重県":"2",
    "滋賀県":"3", "京都府":"3", "大阪府":"3", "兵庫県":"3", "奈良県":"3", "和歌山県":"3",
    "鳥取県":"4", "島根県":"4", "岡山県":"4", "広島県":"4", "山口県":"4",
    "徳島県":"5", "香川県":"5", "愛媛県":"5", "高知県":"5",
    "福岡県":"6", "佐賀県":"6", "長崎県":"6", "熊本県":"6", "大分県":"6", "宮崎県":"6", "鹿児島県":"6", "沖縄県":"6"
};

function getCallArea(address){

    const text=Object.values(address || {}).join(" ");
    const prefecture=Object.keys(callAreaByPrefecture).find(name=>text.includes(name));

    return prefecture ? callAreaByPrefecture[prefecture]+"エリア（"+prefecture+"）" : "--エリア";

}

function formatJapaneseAddress(address,displayName){

    const raw=[...Object.values(address || {}),displayName || ""].join(" ");
    const prefecture=Object.keys(callAreaByPrefecture).find(name=>raw.includes(name));
    const municipality=address?.city || address?.town || address?.village || address?.municipality || address?.city_district;
    const parts=[
        prefecture,
        address?.county,
        municipality,
        address?.city_district,
        address?.suburb,
        address?.neighbourhood,
        address?.quarter,
        address?.hamlet,
        address?.road,
        address?.house_number
    ].filter(Boolean);

    return [...new Set(parts)].join("") || "住所を取得できませんでした";

}

function formatNearbyAddress(text){
    if(!text || /^(住所：|GPS|--)/.test(text) || text.includes("取得中") || text.includes("取得できません") || text.includes("未取得")) return text;
    return text.endsWith("付近") ? text : text+"付近";
}

/* オフライン時は、過去に取得した地域情報を近い場所で再利用する */
const GEO_CACHE_KEY="chokeiryo-log-geo-cache-v1";

function geoCacheKey(latitude,longitude){
    return (Math.round(latitude*200)/200).toFixed(3)+","+(Math.round(longitude*200)/200).toFixed(3);
}

function readGeoCache(){
    try{return JSON.parse(localStorage.getItem(GEO_CACHE_KEY))||{};}catch(error){return {};}
}

function saveGeoCache(latitude,longitude,changes){
    const cache=readGeoCache();
    const key=geoCacheKey(latitude,longitude);
    cache[key]={...(cache[key]||{}),...changes,updatedAt:Date.now()};
    const keys=Object.keys(cache).sort((first,second)=>(cache[second].updatedAt||0)-(cache[first].updatedAt||0)).slice(0,80);
    const trimmed={};
    keys.forEach(item=>trimmed[item]=cache[item]);
    try{localStorage.setItem(GEO_CACHE_KEY,JSON.stringify(trimmed));}catch(error){}
}

function applyOfflineGeoCache(latitude,longitude,showSavedLabel=false){
    const cached=readGeoCache()[geoCacheKey(latitude,longitude)];
    if(!cached) return false;
    const savedLabel=showSavedLabel ? "（保存済み）" : "";
    if(cached.address){
        addr.textContent=savedLabel+formatNearbyAddress(cached.address);
        area.textContent=cached.area||"--エリア";
    }
    if(cached.jcc) jcc.textContent=cached.jcc+savedLabel;
    return Boolean(cached.address||cached.jcc);
}

/* 全国の市区町村・郡を、初回ダウンロード後は通信なしで判定する。 */
let offlineMunicipalityData=null;
let offlineMunicipalityLoading=null;

function ensureOfflineMunicipalityData(){
    if(offlineMunicipalityData) return Promise.resolve(offlineMunicipalityData);
    if(!offlineMunicipalityLoading && window.OfflineMunicipalityEngine){
        offlineMunicipalityLoading=window.OfflineMunicipalityEngine
            .load("./data/japan-municipalities-offline.json")
            .then(data=>{
                offlineMunicipalityData=data;
                return data;
            })
            .catch(error=>{
                offlineMunicipalityLoading=null;
                throw error;
            });
    }
    return offlineMunicipalityLoading || Promise.reject(new Error("全国行政区域判定を準備中です"));
}

async function findOfflineMunicipality(latitude,longitude){
    try{
        const data=await ensureOfflineMunicipalityData();
        return window.OfflineMunicipalityEngine.locate(latitude,longitude,data);
    }catch(error){
        return null;
    }
}

let offlineTownData=null;
let offlineTownLoading=null;

function ensureOfflineTownData(){
    if(offlineTownData) return Promise.resolve(offlineTownData);
    if(!offlineTownLoading && window.OfflineTownEngine){
        offlineTownLoading=window.OfflineTownEngine.load("./data/japan-town-points.json")
            .then(data=>{
                offlineTownData=data;
                return data;
            })
            .catch(error=>{
                offlineTownLoading=null;
                throw error;
            });
    }
    return offlineTownLoading || Promise.reject(new Error("町字住所データを準備中です"));
}

async function findOfflineTown(latitude,longitude,municipality){
    try{
        const data=await ensureOfflineTownData();
        return window.OfflineTownEngine.nearest(latitude,longitude,municipality.code,data);
    }catch(error){
        return null;
    }
}

async function showOfflineMunicipality(latitude,longitude,preferSavedAddress=false){
    const hit=await findOfflineMunicipality(latitude,longitude);
    if(!hit) return false;
    if(!preferSavedAddress){
        const town=await findOfflineTown(latitude,longitude,hit);
        const townText=town&&town.distanceMeters<=3000 ? town.town+town.koaza+"（町字推定）" : "";
        addr.textContent=formatNearbyAddress(hit.address+townText+"（オフライン判定）");
        addr.title=hit.address;
    }
    area.textContent=getCallArea({prefecture:hit.prefecture});
    return true;
}

let offlineJccData=null;
let offlineJccLoading=null;

function ensureOfflineJccData(){
    if(offlineJccData) return Promise.resolve(offlineJccData);
    if(!offlineJccLoading && window.OfflineJccEngine){
        offlineJccLoading=window.OfflineJccEngine.load("./data/jarl-jcc-jcg-index.json")
            .then(data=>{
                offlineJccData=data;
                return data;
            })
            .catch(error=>{
                offlineJccLoading=null;
                throw error;
            });
    }
    return offlineJccLoading || Promise.reject(new Error("JCC/JCG番号表を準備中です"));
}

async function findOfflineJcc(latitude,longitude){
    try{
        const [municipality,jccData]=await Promise.all([
            findOfflineMunicipality(latitude,longitude),
            ensureOfflineJccData()
        ]);
        return municipality ? window.OfflineJccEngine.find(municipality,jccData) : null;
    }catch(error){
        return null;
    }
}


/* ==========================================================
   POTA / SOTA モード（日本国内）
========================================================== */

let programMode=false;
let latestPosition=null;
let programData=null;
let programDataLoading=null;
let potaBoundaryData=null;
let potaBoundaryLoading=null;
let nationalPotaCandidateIndex=null;
let nationalPotaCandidateIndexLoading=null;
const nationalPotaCandidateCache=new Map();
let nationalPotaCandidateData=null;
let urbanPotaCandidateIndex=null;
let urbanPotaCandidateIndexLoading=null;
const urbanPotaCandidateCache=new Map();
let urbanPotaCandidateData=null;
let osmPotaCandidateIndex=null;
let osmPotaCandidateIndexLoading=null;
const osmPotaCandidateCache=new Map();
let osmPotaCandidateData=null;
let lastProgramMatches={pota:"",sota:""};
let hasPotaNotificationBaseline=false;
let hasSotaNotificationBaseline=false;
let sotaEvaluationSequence=0;
const sotaEvaluationCache=new Map();

async function decodeJapanProgramData(){
    if(!("DecompressionStream" in window)) throw new Error("このSafariでは同梱データを展開できません");
    const bytes=Uint8Array.from(atob(JAPAN_PROGRAM_DATA_PARTS.join("")),character=>character.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(stream).json();
}

const PROGRAM_CACHE_KEY="chokeiryo-log-japan-program-data-v1";
const PROGRAM_CACHE_MAX_AGE=14*24*60*60*1000;
const POTA_NEARBY_METERS=1500;
const SOTA_NEARBY_METERS=500;

function showProgramStatus(potaMessage,sotaMessage){

    potaStatus.textContent="POTA："+potaMessage;
    sotaStatus.textContent="SOTA："+sotaMessage;

}

function parseCsvLine(line){

    const cells=[];
    let cell="";
    let quoted=false;

    for(let i=0;i<line.length;i++){
        const character=line[i];
        if(character==='"'){
            if(quoted&&line[i+1]==='"'){
                cell+='"';
                i++;
            }else{
                quoted=!quoted;
            }
        }else if(character===','&&!quoted){
            cells.push(cell);
            cell="";
        }else{
            cell+=character;
        }
    }

    cells.push(cell);
    return cells;

}

function distanceMeters(latitude1,longitude1,latitude2,longitude2){

    const radians=Math.PI/180;
    const latitudeDifference=(latitude2-latitude1)*radians;
    const longitudeDifference=(longitude2-longitude1)*radians;
    const value=Math.sin(latitudeDifference/2)**2+
        Math.cos(latitude1*radians)*Math.cos(latitude2*radians)*Math.sin(longitudeDifference/2)**2;

    return 6371000*2*Math.atan2(Math.sqrt(value),Math.sqrt(1-value));

}

function cachedProgramData(){

    try{
        const cached=JSON.parse(localStorage.getItem(PROGRAM_CACHE_KEY));
        if(cached&&cached.savedAt&&Array.isArray(cached.pota)&&Array.isArray(cached.sota)) return cached;
    }catch(error){}

    return null;

}

async function loadProgramData(){

    const embedded=await decodeJapanProgramData();
    return {
        savedAt:Date.now(),
        pota:embedded.pota.map(entry=>({
            id:entry[0],name:entry[1],latitude:entry[2],longitude:entry[3]
        })),
        sota:embedded.sota.map(entry=>({
            id:entry[0],name:entry[1],latitude:entry[2],longitude:entry[3],altitude:entry[4]
        }))
    };

    const cached=cachedProgramData();
    if(cached&&Date.now()-cached.savedAt<PROGRAM_CACHE_MAX_AGE){
        return cached;
    }

    if(!navigator.onLine){
        if(cached) return cached;
        throw new Error("オフラインのため判定データを取得できません");
    }

    const [potaResponse,sotaResponse]=await Promise.all([
        fetch("https://pota.app/all_parks_ext.csv"),
        fetch("https://storage.sota.org.uk/summitslist.csv")
    ]);

    if(!potaResponse.ok||!sotaResponse.ok) throw new Error("判定データを取得できませんでした");

    const [potaCsv,sotaCsv]=await Promise.all([potaResponse.text(),sotaResponse.text()]);
    const pota=potaCsv.split(/\r?\n/).slice(1).map(parseCsvLine)
        .filter(row=>row[0]&&row[0].startsWith("JP-")&&row[2]==="1"&&Number.isFinite(Number(row[5]))&&Number.isFinite(Number(row[6])))
        .map(row=>({id:row[0],name:row[1],latitude:Number(row[5]),longitude:Number(row[6])}));
    const sota=sotaCsv.split(/\r?\n/).slice(2).map(parseCsvLine)
        .filter(row=>row[0]&&/^(JA|JA5|JA6|JA8)\//.test(row[0])&&Number.isFinite(Number(row[8]))&&Number.isFinite(Number(row[9])))
        .map(row=>({id:row[0],name:row[3],latitude:Number(row[9]),longitude:Number(row[8]),altitude:Number(row[4])}));
    const data={savedAt:Date.now(),pota,sota};

    try{ localStorage.setItem(PROGRAM_CACHE_KEY,JSON.stringify(data)); }catch(error){}

    return data;

}

        })().catch(()=>null).finally(()=>{ potaBoundaryLoading=null; });

async function ensureNationalPotaCandidateData(position){
    if(!window.PotaBoundaryEngine || !position) return null;
    if(!nationalPotaCandidateIndexLoading && !nationalPotaCandidateIndex){
        nationalPotaCandidateIndexLoading=fetch("./data/pota-boundaries-national-index.json")
            .then(response=>response.ok ? response.json() : null)
            .catch(()=>null)
            .then(data=>{
                nationalPotaCandidateIndex=data;
                return data;
            })
            .finally(()=>{ nationalPotaCandidateIndexLoading=null; });
    }
    if(nationalPotaCandidateIndexLoading) await nationalPotaCandidateIndexLoading;
    const parks=Array.isArray(nationalPotaCandidateIndex?.parks) ? nationalPotaCandidateIndex.parks : [];
    const latitudeMargin=Math.max(0.01,(Number(position.accuracy)||0)/110540);
    const longitudeMargin=Math.max(0.01,latitudeMargin/Math.max(0.2,Math.cos(position.latitude*Math.PI/180)));
    const nearby=parks.filter(park=>
        position.latitude>=park.minLatitude-latitudeMargin && position.latitude<=park.maxLatitude+latitudeMargin &&
        position.longitude>=park.minLongitude-longitudeMargin && position.longitude<=park.maxLongitude+longitudeMargin
    );
    await Promise.all(nearby.map(async park=>{
        if(nationalPotaCandidateCache.has(park.ref)) return;
        try{
            const file="./data/"+String(park.file||"").replace(/^\.\//u,"");
            const collection=await window.PotaBoundaryEngine.load(file);
            const feature=collection.features && collection.features[0];
            if(feature){
                feature.properties={...feature.properties,nationalCandidate:true};
                nationalPotaCandidateCache.set(park.ref,feature);
            }
        }catch(error){}
    }));
    nationalPotaCandidateData={type:"FeatureCollection",features:[...nationalPotaCandidateCache.values()]};
    return nationalPotaCandidateData;

function programMatches(position){

    const nearest=(items,limit)=>items.map(item=>({...item,distance:distanceMeters(position.latitude,position.longitude,item.latitude,item.longitude)}))
        .filter(item=>item.distance<=limit)
        .sort((first,second)=>first.distance-second.distance);

    const boundaryFeatures=potaBoundaryData && Array.isArray(potaBoundaryData.features)
        ? potaBoundaryData.features.filter(feature=>feature.geometry)
        : [];
    const boundaryRefs=new Set(boundaryFeatures.map(feature=>feature.properties && feature.properties.potaRef).filter(Boolean));
    const boundaryMatches=(window.PotaBoundaryEngine && potaBoundaryData)
        ? window.PotaBoundaryEngine.classifyParks(position.latitude,position.longitude,potaBoundaryData,position.accuracy)
            .map(result=>({
                id:result.feature.properties.potaRef,
                name:(result.feature.properties.nameJa || result.feature.properties.nameEn || result.feature.properties.potaRef)+(result.state==="boundary" ? " [境界付近]" : ""),
                distance:0,
                boundary:true,
                boundaryState:result.state,
                boundaryMeters:result.boundaryMeters
            }))
        : [];
    const candidateFeatures=[
        ...(Array.isArray(nationalPotaCandidateData?.features) ? nationalPotaCandidateData.features : []),
        ...(Array.isArray(urbanPotaCandidateData?.features) ? urbanPotaCandidateData.features : []),
        ...(Array.isArray(osmPotaCandidateData?.features) ? osmPotaCandidateData.features : [])
    ];
    const candidateData={type:"FeatureCollection",features:candidateFeatures};
    const nationalCandidateMatches=(window.PotaBoundaryEngine && candidateFeatures.length)
        ? window.PotaBoundaryEngine.classifyParks(position.latitude,position.longitude,candidateData,position.accuracy)
            .filter(result=>!boundaryRefs.has(result.feature.properties.potaRef))
            .map(result=>({
                id:result.feature.properties.potaRef,
                name:(result.feature.properties.nameJa || result.feature.properties.nameEn || result.feature.properties.potaRef)+(result.feature.properties.osmParkCandidate ? " [OSM候補・要公式確認]" : result.feature.properties.urbanParkCandidate ? " [都市公園候補・要公式確認]" : " [全国候補・要公式確認]"),
                distance:0,
                boundary:false,
                candidate:true,
                boundaryState:result.state,
                boundaryMeters:result.boundaryMeters
            }))
        : [];
    const nationalCandidateRefs=new Set(nationalCandidateMatches.map(match=>match.id));

    return {
        pota:[...boundaryMatches,...nationalCandidateMatches,...nearest(programData.pota.filter(item=>!boundaryRefs.has(item.id)&&!nationalCandidateRefs.has(item.id)),POTA_NEARBY_METERS)],
        sota:nearest(programData.sota,SOTA_NEARBY_METERS)
    };

}

function formatProgramMatches(matches,type){

    if(!matches.length) return "スポット外です";

    const hasBoundaryMatch=type==="pota" && matches.some(match=>match.boundary);
    const suffix=type==="pota" ? (hasBoundaryMatch ? "（公式区域・境界判定）" : "（位置目安・境界要確認）") : "（山頂から";
    const lines=matches.slice(0,3).map(match=>type==="pota"
        ? match.id+" "+match.name+(match.boundary ? "" : " 約"+Math.round(match.distance/100)/10+"km")
        : match.id+" "+match.name+" "+Math.round(match.distance)+"m");

    return lines.join(" ／ ")+(type==="pota" ? suffix : suffix+"）");

}

function notifyProgramArrival(type,matches){

    const key=matches.map(match=>match.id).join(",");
    const previousKey=lastProgramMatches[type];
    if(key===previousKey){
        lastProgramMatches[type]=key;
        return;
    }

    lastProgramMatches[type]=key;
    const label=type==="pota" ? "POTA" : "SOTA";
    const element=type==="pota" ? potaStatus : sotaStatus;
    element.classList.remove("arrival");
    void element.offsetWidth;
    element.classList.add("arrival");
    setTimeout(()=>element.classList.remove("arrival"),1800);

    if(navigator.vibrate) navigator.vibrate(key ? [120,80,120] : [240]);

    try{
        const audioContext=new (window.AudioContext||window.webkitAudioContext)();
        const oscillator=audioContext.createOscillator();
        const gain=audioContext.createGain();
        oscillator.frequency.value=key ? 880 : 440;
        gain.gain.setValueAtTime(0.05,audioContext.currentTime);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime+0.16);
        oscillator.onended=()=>audioContext.close();
    }catch(error){}

    alert(key
        ? (type==="sota" ? "SOTAの公式25m区域に入りました：\n" : label+"のスポット候補に入りました：\n")+matches.slice(0,3).map(match=>match.id+" "+match.name).join("\n")
        : type==="sota" ? "SOTAの公式25m区域外に出ました。" : label+"のスポット候補の範囲外に出ました。");

}

async function refreshProgramStatus(){

    if(!programMode) return;

    if(!latestPosition){
        showProgramStatus("位置情報を取得中…","位置情報を取得中…");
        return;
    }

    if(!programData){
        showProgramStatus("日本データを準備中…","日本データを準備中…");
        try{
            await ensureProgramData();
        }catch(error){
            showProgramStatus("データ取得に失敗しました","データ取得に失敗しました");
            return;
        }
    }

    await ensurePotaBoundaryData();
    await ensureNationalPotaCandidateData(latestPosition);
    await ensureUrbanPotaCandidateData(latestPosition);
    await ensureOsmPotaCandidateData(latestPosition);
    const matches=programMatches(latestPosition);
    const positionAssessment=window.GpsPositionController?.assess(latestPosition);
    const notificationSafe=positionAssessment?.notificationSafe===true;
    const potaMessage=formatProgramMatches(matches.pota,"pota")+(notificationSafe ? "" : "（簡易位置・通知なし）");
    showProgramStatus(potaMessage,"25m地形判定を確認中…");
    if(notificationSafe&&hasPotaNotificationBaseline){
        notifyProgramArrival("pota",matches.pota);
    }else if(notificationSafe){
        lastProgramMatches.pota=matches.pota.map(match=>match.id).join(",");
        hasPotaNotificationBaseline=true;
    }

    if(!window.SotaRuntimeController){
        sotaStatus.textContent="SOTA：25m地形判定を準備できません";
        return;
    }
    const sequence=++sotaEvaluationSequence;
    const cacheKey=[latestPosition.latitude.toFixed(5),latestPosition.longitude.toFixed(5),Math.round(Number(latestPosition.accuracy)||0)].join(",");
    let evaluationPromise=sotaEvaluationCache.get(cacheKey);
    if(!evaluationPromise){
        evaluationPromise=window.SotaRuntimeController.evaluate(latestPosition,programData.sota);
        sotaEvaluationCache.set(cacheKey,evaluationPromise);
        while(sotaEvaluationCache.size>12) sotaEvaluationCache.delete(sotaEvaluationCache.keys().next().value);
    }
    const evaluation=await evaluationPromise.catch(()=>({message:"25m地形判定を完了できません（通知なし）",notificationSafe:false,confirmed:[]}));
    if(sequence!==sotaEvaluationSequence||!programMode) return;
    sotaStatus.textContent="SOTA："+window.SotaRuntimeController.format(evaluation);
    const confirmed=evaluation.confirmed||[];
    if(notificationSafe&&evaluation.notificationSafe&&hasSotaNotificationBaseline){
        notifyProgramArrival("sota",confirmed);
    }else if(notificationSafe&&evaluation.notificationSafe){
        lastProgramMatches.sota=confirmed.map(match=>match.id).join(",");
        hasSotaNotificationBaseline=true;
    }

}

async function updateAddress(latitude,longitude){

    if(!navigator.onLine){
        const hasSavedAddress=applyOfflineGeoCache(latitude,longitude,true);
        if(await showOfflineMunicipality(latitude,longitude,hasSavedAddress)) return;
        if(!hasSavedAddress){
            addr.textContent="住所：オフラインのため未取得";
            area.textContent="--エリア";
        }
        return;
    }

    addr.textContent="住所：取得中…";

    try{

        const response=await fetch(
            "https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ja&lat="+
            encodeURIComponent(latitude)+"&lon="+encodeURIComponent(longitude)
        );

        if(!response.ok) throw new Error("住所を取得できませんでした");

        const data=await response.json();
        const address=formatJapaneseAddress(data.address,data.display_name);

        addr.textContent=formatNearbyAddress(address);
        addr.title=addr.textContent;
        area.textContent=getCallArea(data.address);
        saveGeoCache(latitude,longitude,{address,area:area.textContent});

    }catch(error){

        if(!applyOfflineGeoCache(latitude,longitude)){
            addr.textContent="住所：通信時に取得します";
            area.textContent="--エリア";
        }

    }

}

async function updateJcc(latitude,longitude){

    const jcc=document.getElementById("jcc");

    if(!navigator.onLine){
        const cached=readGeoCache()[geoCacheKey(latitude,longitude)];
        if(cached?.jcc){
            jcc.textContent=cached.jcc+"（保存済み）";
            return;
        }
        const offlineJcc=await findOfflineJcc(latitude,longitude);
        jcc.textContent=offlineJcc ? offlineJcc.type+" "+offlineJcc.code+"（オフライン判定）" : "JCC/JCG：オフライン判定中…";
        return;
    }

    jcc.textContent="JCC/JCG 判定中…";

    try{

        const response=await fetch(
            "https://galuchat.nyatla.jp/rjcc?lat="+encodeURIComponent(latitude)+
            "&lon="+encodeURIComponent(longitude)
        );

        if(!response.ok) throw new Error("JCC/JCGを取得できませんでした");

        const data=await response.json();
        const code=data.jcc?.code;
        const name=data.jcc?.name;

        jcc.textContent=code ? "JCC/JCG "+code : "JCC/JCG 判定対象外";
        jcc.title=name || "";
        saveGeoCache(latitude,longitude,{jcc:jcc.textContent});

    }catch(error){

        const cached=readGeoCache()[geoCacheKey(latitude,longitude)];
        jcc.textContent=cached?.jcc || "JCC/JCG 取得できません";

    }

}

function requestLocation(){

    if(drawing||memoDrawing){
        pendingLocationUpdate=true;
        return;
    }

    if(!navigator.geolocation){

        gps.textContent="📍 このブラウザはGPSに対応していません";
        return;

    }

    const requestSequence=++locationRequestSequence;
    let receivedPosition=false;
    let pendingLocationRequests=2;
    gps.textContent="📍 GPS取得中…（まず簡易位置）";
    area.textContent="エリア判定中…";

    const acceptPosition=position=>{
            if(requestSequence!==locationRequestSequence) return;
            const normalized=window.GpsPositionController?.normalize(position);
            if(!normalized) return;
            receivedPosition=true;
            if(!window.GpsPositionController.shouldReplace(latestPosition,normalized)&&latestPosition) return;
            latestPosition=normalized;
            const assessment=window.GpsPositionController.assess(latestPosition);
            const {latitude,longitude,altitude,accuracy,altitudeAccuracy}=latestPosition;
            gps.textContent="📍 "+latitude.toFixed(5)+", "+longitude.toFixed(5)+(accuracy===null ? "（精度不明・通知なし）" : "（±"+Math.round(accuracy)+"m"+(assessment.notificationSafe ? "" : "・簡易位置・通知なし")+"）");
            if(!applyOfflineGeoCache(latitude,longitude)) area.textContent="エリア判定中…";
            alt.textContent=altitude===null
                ? "GPS標高 未取得"
                : "GPS標高 "+Math.round(altitude)+"m"+(altitudeAccuracy===null ? "（精度不明）" : " ±"+Math.round(altitudeAccuracy)+"m");
            updateAddress(latitude,longitude);
            updateJcc(latitude,longitude);
            refreshProgramStatus();
    };
    const handleError=error=>{
            pendingLocationRequests--;
            if(requestSequence!==locationRequestSequence||receivedPosition||latestPosition||pendingLocationRequests>0) return;
            const messages={
                1:"位置情報の利用を許可してください",
                2:"位置情報を取得できませんでした",
                3:"位置情報の取得が時間切れになりました"
            };

            gps.textContent="📍 "+(messages[error.code] || "位置情報を取得できませんでした");
            area.textContent="--エリア";
    };

    navigator.geolocation.getCurrentPosition(acceptPosition,handleError,{enableHighAccuracy:false,timeout:4000,maximumAge:300000});
    navigator.geolocation.getCurrentPosition(acceptPosition,handleError,{enableHighAccuracy:true,timeout:15000,maximumAge:30000});

}

function roundRectPath(context,x,y,width,height,radius){

    const r=Math.min(radius,width/2,height/2);
    context.beginPath();
    context.moveTo(x+r,y);
    context.arcTo(x+width,y,x+width,y+height,r);
    context.arcTo(x+width,y+height,x,y+height,r);
    context.arcTo(x,y+height,x,y,r);
    context.arcTo(x,y,x+width,y,r);
    context.closePath();

}

function drawSnapshotElement(context,element,text,centerText=false){

    const rect=element.getBoundingClientRect();
    const style=getComputedStyle(element);
    const background=style.backgroundColor;

    if(background!=="rgba(0, 0, 0, 0)" && background!=="transparent"){
        context.fillStyle=background;
        roundRectPath(context,rect.left,rect.top,rect.width,rect.height,Number.parseFloat(style.borderRadius) || 0);
        context.fill();
    }

    context.save();
    roundRectPath(context,rect.left,rect.top,rect.width,rect.height,Number.parseFloat(style.borderRadius) || 0);
    context.clip();
    context.fillStyle=style.color;
    context.font=(style.fontWeight || "normal")+" "+(style.fontSize || "13px")+" "+(style.fontFamily || "sans-serif");
    context.textBaseline="middle";
    context.textAlign=centerText ? "center" : "left";
    context.fillText(
        text,
        centerText ? rect.left+rect.width/2 : rect.left+6,
        rect.top+rect.height/2,
        Math.max(0,rect.width-12)
    );
    context.restore();

}

function createLogSnapshot(){

    const width=window.innerWidth;
    const height=window.innerHeight;
    const includeMemo=Boolean((memoStrokes.length||memoCurrentStroke.length)&&memoSnapshotRect&&memoCanvas.width);
    const memoHeight=includeMemo ? memoSnapshotRect.height+38 : 0;
    const scale=2;
    const snapshot=document.createElement("canvas");
    snapshot.width=Math.round(width*scale);
    snapshot.height=Math.round((height+memoHeight)*scale);

    const snapshotContext=snapshot.getContext("2d");
    snapshotContext.scale(scale,scale);
    snapshotContext.fillStyle=getComputedStyle(body).getPropertyValue("--bg").trim();
    snapshotContext.fillRect(0,0,width,height+memoHeight);

    const header=document.querySelector("header");
    const footer=document.querySelector("footer");
    const headerRect=header.getBoundingClientRect();
    const footerRect=footer.getBoundingClientRect();
    snapshotContext.fillStyle=getComputedStyle(header).backgroundColor;
    snapshotContext.fillRect(headerRect.left,headerRect.top,headerRect.width,headerRect.height);
    snapshotContext.fillStyle=getComputedStyle(footer).backgroundColor;
    snapshotContext.fillRect(footerRect.left,footerRect.top,footerRect.width,footerRect.height);

    drawSnapshotElement(snapshotContext,jst,jst.textContent);
    drawSnapshotElement(snapshotContext,themeButton,themeButton.textContent);
    drawSnapshotElement(snapshotContext,utc,utc.textContent);

    if(programMode){
        drawSnapshotElement(snapshotContext,programPanel,"");
        drawSnapshotElement(snapshotContext,potaStatus,potaStatus.textContent);
        drawSnapshotElement(snapshotContext,sotaStatus,sotaStatus.textContent);
    }

    document.querySelectorAll("#gpsInfo > div").forEach(element=>{
        drawSnapshotElement(snapshotContext,element,element.textContent);
    });

    const canvasRect=canvas.getBoundingClientRect();
    snapshotContext.drawImage(canvas,canvasRect.left,canvasRect.top,canvasRect.width,canvasRect.height);

    if(includeMemo){
        const memoRect=memoSnapshotRect;
        const memoTop=height+8;
        snapshotContext.fillStyle=getComputedStyle(memoArea).backgroundColor;
        snapshotContext.fillRect(8,memoTop,width-16,memoRect.height+22);
        snapshotContext.fillStyle="#ffffff";
        snapshotContext.font="bold 14px sans-serif";
        snapshotContext.fillText("MEMO",16,memoTop+15);
        snapshotContext.drawImage(memoCanvas,8,memoTop+22,width-16,memoRect.height);
    }

    [bandSelect,modeSelect,document.getElementById("undoButton"),document.getElementById("clearButton"),memoButton].forEach(element=>{
        const text=element.tagName==="SELECT" ? element.selectedOptions[0].textContent : element.textContent.trim();
        drawSnapshotElement(snapshotContext,element,text);
    });

    drawSnapshotElement(snapshotContext,saveButton,saveButton.textContent.trim(),true);

    return snapshot;

}

async function shareLogImage(){

    createLogSnapshot().toBlob(async blob=>{

        if(!blob){
            alert("画像を作成できませんでした。");
            return;
        }

        const file=new File([blob],imageFileName(),{type:"image/png"});
        const shareData={files:[file],title:"超軽量ログ"};

        try{

            if(navigator.share && (!navigator.canShare || navigator.canShare(shareData))){
                await navigator.share(shareData);
                clearDrawing();
                clearMemoDrawing();
                saveToast.classList.add("show");
                setTimeout(()=>saveToast.classList.remove("show"),1000);
                return;
            }

            const url=URL.createObjectURL(blob);
            const link=document.createElement("a");
            link.href=url;
            link.download=file.name;
            link.click();
            URL.revokeObjectURL(url);

        }catch(error){

            if(error.name!=="AbortError") alert("共有を開始できませんでした。");

        }

    },"image/png");

}

saveButton.addEventListener("click",shareLogImage);


/* ==========================================================
   画面常時点灯（対応するブラウザのみ）
========================================================== */

let wakeLock=null;
let noSleep=null;

async function keepScreenAwake(){

    if(!("wakeLock" in navigator) || wakeLock) return;

    try{

        wakeLock=await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release",()=>{wakeLock=null;});

    }catch(error){

        wakeLock=null;

    }

}

function enableVideoWakeFallback(){

    if(!window.NoSleep || noSleep) return;

    try{

        noSleep=new window.NoSleep();
        noSleep.enable();

    }catch(error){

        noSleep=null;

    }

}

function enableScreenStayAwake(){

    keepScreenAwake();
    enableVideoWakeFallback();

}

document.addEventListener("touchstart",enableScreenStayAwake,{passive:true});
document.addEventListener("click",enableScreenStayAwake,{passive:true});

document.addEventListener("visibilitychange",()=>{

    if(document.visibilityState==="visible") enableScreenStayAwake();

});



/* ==========================================================
   Canvasサイズ
========================================================== */

let strokes = [];
let currentStroke = [];
let canvasCssSize={width:0,height:0};
const PEN_WIDTH=4;

function resizeCanvas(){

    const rect=canvas.getBoundingClientRect();

    if(canvasCssSize.width && canvasCssSize.height){

        const scaleX=rect.width/canvasCssSize.width;
        const scaleY=rect.height/canvasCssSize.height;

        for(const stroke of [...strokes,currentStroke]){
            for(const point of stroke){
                point.x*=scaleX;
                point.y*=scaleY;
            }
        }

    }

    canvasCssSize={width:rect.width,height:rect.height};



    canvas.width=

        rect.width*window.devicePixelRatio;



    canvas.height=

        rect.height*window.devicePixelRatio;



    ctx.setTransform(

        window.devicePixelRatio,

        0,

        0,

        window.devicePixelRatio,

        0,

        0

    );



    ctx.lineWidth=PEN_WIDTH;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    applyPenStyle();

    redrawAll();

}



window.addEventListener(

    "resize",

    resizeCanvas

);


/* ==========================================================
   ガイドライン描画
========================================================== */

function drawGuide(){

    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.restore();

    // 横画面ではガイドラインを表示しない
    if(window.innerWidth > window.innerHeight){
        return;
    }

    ctx.save();

    const w = canvas.width / window.devicePixelRatio;
    const h = canvas.height / window.devicePixelRatio;

    ctx.strokeStyle = "rgba(150,150,150,0.35)";
    ctx.lineWidth = 1;

    // CALL（約30%）
    const y1 = h * 0.30;

    // NAME（約55%）
    const y2 = h * 0.55;

    // RST（約72%）
    const y3 = h * 0.72;

    ctx.beginPath();

    ctx.moveTo(0,y1);
    ctx.lineTo(w,y1);

    ctx.moveTo(0,y2);
    ctx.lineTo(w,y2);

    ctx.moveTo(0,y3);
    ctx.lineTo(w,y3);

    // RST中央線
    ctx.moveTo(w/2,y2);
    ctx.lineTo(w/2,y3);

    ctx.stroke();

    ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--fg").trim();
    ctx.globalAlpha=.55;
    ctx.font="13px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("CALLSIGN",8,18);
    ctx.fillText("QRA",8,y1+18);
    ctx.fillText("送ったRST",8,y2+18);
    ctx.fillText("受け取ったRST",w/2+8,y2+18);
    ctx.fillText("QTH",8,y3+18);

    ctx.restore();

}


/* ==========================================================
   Canvas 初期化
========================================================== */

resizeCanvas();


/* ==========================================================
   手書き
========================================================== */

let drawing = false;
let pendingLocationUpdate=false;

ctx.lineWidth = PEN_WIDTH;

ctx.lineCap = "round";

ctx.lineJoin = "round";

applyPenStyle();


function getPos(e){

    const rect = canvas.getBoundingClientRect();

    if(e.touches){

        return{

            x:e.touches[0].clientX-rect.left,

            y:e.touches[0].clientY-rect.top

        };

    }

    return{

        x:e.offsetX,

        y:e.offsetY

    };

}


function startDraw(e){

    e.preventDefault();
    enableScreenStayAwake();

    drawing = true;

    currentStroke=[];

    const p=getPos(e);

    currentStroke.push(p);

}


function moveDraw(e){

    if(!drawing) return;

    e.preventDefault();

    const p=getPos(e);

    currentStroke.push(p);

    redrawAll();

}


function endDraw(e){

    if(!drawing) return;

    drawing=false;

    if(currentStroke.length){

        strokes.push(currentStroke);

    }

    if(pendingLocationUpdate){
        pendingLocationUpdate=false;
        setTimeout(requestLocation,180);
    }

}

/* ==========================================================
   全再描画
========================================================== */

function redrawAll(){

    drawGuide();

    ctx.beginPath();

    for(const stroke of strokes){

        if(stroke.length===1){

            ctx.beginPath();
            ctx.arc(stroke[0].x,stroke[0].y,ctx.lineWidth/2,0,Math.PI*2);
            ctx.fillStyle=ctx.strokeStyle;
            ctx.fill();
            continue;

        }

        ctx.beginPath();

        ctx.moveTo(stroke[0].x,stroke[0].y);

        for(let i=1;i<stroke.length;i++){

            ctx.lineTo(stroke[i].x,stroke[i].y);

        }

        ctx.stroke();

    }

    if(currentStroke.length>1){

        ctx.beginPath();

        ctx.moveTo(currentStroke[0].x,currentStroke[0].y);

        for(let i=1;i<currentStroke.length;i++){

            ctx.lineTo(currentStroke[i].x,currentStroke[i].y);

        }

        ctx.stroke();

    }else if(currentStroke.length===1){

        ctx.beginPath();
        ctx.arc(currentStroke[0].x,currentStroke[0].y,ctx.lineWidth/2,0,Math.PI*2);
        ctx.fillStyle=ctx.strokeStyle;
        ctx.fill();

    }

}


/* ==========================================================
   Undo
========================================================== */

document.getElementById("undoButton").onclick=()=>{

    if(memoArea.classList.contains("active")){
        memoStrokes.pop();
        redrawMemo();
    }else{
        strokes.pop();
        redrawAll();
    }

};


/* ==========================================================
   全消去
========================================================== */

function clearDrawing(){

    strokes=[];
    currentStroke=[];
    redrawAll();

}

document.getElementById("clearButton").onclick=()=>{

    if(memoArea.classList.contains("active")){
        clearMemoDrawing();
    }else{
        clearDrawing();
    }

};

/* ==========================================================
   MEMO 手書きエリア
========================================================== */

let memoStrokes=[];
let memoCurrentStroke=[];
let memoDrawing=false;
let memoCssSize={width:0,height:0};
let memoSnapshotRect=null;

function layoutMemoArea(){
    const canvasRect=canvas.getBoundingClientRect();
    const toolRect=document.getElementById("toolBar").getBoundingClientRect();
    const top=canvasRect.top+canvasRect.height*0.125;
    memoArea.style.top=Math.round(top)+"px";
    memoArea.style.bottom=Math.max(0,Math.round(window.innerHeight-toolRect.top))+"px";
}

function resizeMemoCanvas(){
    const rect=memoCanvas.getBoundingClientRect();
    if(!rect.width||!rect.height) return;
    if(memoCssSize.width&&memoCssSize.height){
        const scaleX=rect.width/memoCssSize.width;
        const scaleY=rect.height/memoCssSize.height;
        for(const stroke of [...memoStrokes,memoCurrentStroke]){
            stroke.forEach(point=>{point.x*=scaleX;point.y*=scaleY;});
        }
    }
    memoCssSize={width:rect.width,height:rect.height};
    memoSnapshotRect={left:rect.left,top:rect.top,width:rect.width,height:rect.height};
    memoCanvas.width=Math.round(rect.width*devicePixelRatio);
    memoCanvas.height=Math.round(rect.height*devicePixelRatio);
    memoCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    memoCtx.lineWidth=PEN_WIDTH;
    memoCtx.lineCap="round";
    memoCtx.lineJoin="round";
    redrawMemo();
}

function redrawMemo(){
    if(!memoCanvas.width) return;
    const width=memoCanvas.width/devicePixelRatio;
    const height=memoCanvas.height/devicePixelRatio;
    memoCtx.clearRect(0,0,width,height);
    memoCtx.strokeStyle=getComputedStyle(body).getPropertyValue("--pen").trim();
    memoCtx.fillStyle=memoCtx.strokeStyle;
    for(const stroke of [...memoStrokes,memoCurrentStroke]){
        if(!stroke.length) continue;
        if(stroke.length===1){
            memoCtx.beginPath();
            memoCtx.arc(stroke[0].x,stroke[0].y,PEN_WIDTH/2,0,Math.PI*2);
            memoCtx.fill();
            continue;
        }
        memoCtx.beginPath();
        memoCtx.moveTo(stroke[0].x,stroke[0].y);
        stroke.slice(1).forEach(point=>memoCtx.lineTo(point.x,point.y));
        memoCtx.stroke();
    }
}

function clearMemoDrawing(){
    memoStrokes=[];
    memoCurrentStroke=[];
    redrawMemo();
}

function memoPosition(event){
    const rect=memoCanvas.getBoundingClientRect();
    const point=event.touches ? event.touches[0] : event;
    return {x:point.clientX-rect.left,y:point.clientY-rect.top};
}

function startMemo(event){
    event.preventDefault();
    enableScreenStayAwake();
    memoDrawing=true;
    memoCurrentStroke=[memoPosition(event)];
}

function moveMemo(event){
    if(!memoDrawing) return;
    event.preventDefault();
    memoCurrentStroke.push(memoPosition(event));
    redrawMemo();
}

function endMemo(){
    if(!memoDrawing) return;
    memoDrawing=false;
    if(memoCurrentStroke.length) memoStrokes.push(memoCurrentStroke);
    memoCurrentStroke=[];
    redrawMemo();
    if(pendingLocationUpdate){pendingLocationUpdate=false;setTimeout(requestLocation,180);}
}

memoButton.addEventListener("click",()=>{
    const isOpen=memoArea.classList.toggle("active");
    memoButton.setAttribute("aria-pressed",String(isOpen));
    requestAnimationFrame(()=>requestAnimationFrame(()=>{layoutMemoArea();resizeMemoCanvas();}));
});

memoCanvas.addEventListener("mousedown",startMemo);
memoCanvas.addEventListener("mousemove",moveMemo);
window.addEventListener("mouseup",endMemo);
memoCanvas.addEventListener("touchstart",startMemo,{passive:false});
memoCanvas.addEventListener("touchmove",moveMemo,{passive:false});
window.addEventListener("touchend",endMemo);
window.addEventListener("touchcancel",endMemo);
window.addEventListener("resize",()=>{layoutMemoArea();resizeMemoCanvas();});


/* ==========================================================
   イベント
========================================================== */

canvas.addEventListener("mousedown",startDraw);

canvas.addEventListener("mousemove",moveDraw);

window.addEventListener("mouseup",endDraw);

canvas.addEventListener("touchstart",startDraw,{passive:false});

canvas.addEventListener("touchmove",moveDraw,{passive:false});

window.addEventListener("touchend",endDraw);

window.addEventListener("touchcancel",endDraw);

    e.preventDefault();

});

document.addEventListener("dblclick",function(e){

});

},{passive:false});

========================================================== */

redrawAll();

        });
    });
}
